<html lang="zh-CN" data-standalone-demo><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>透明盘面 · Padview 示例</title><link rel="stylesheet" href="../layout.css" data-padview-layout-css><link rel="stylesheet" href="./demo.css"></head><body data-example="transparent"><main>
<nav class="demo-nav" aria-label="示例导航"><a href="./index.html">全部示例</a><a href="./original.html">原始预览器</a><a href="./transparent.html" aria-current="page">透明盘面</a><a href="./components.html">信息组件总览</a><a href="./center.html">原版中心组件总览</a><a href="./labels.html">中心字母与数字</a><a href="./cover.html">封面背景</a><a href="./pv.html">PV 背景</a><a href="./player.html">Player 手动试玩</a><a href="./api.html">API 文档</a></nav><p class="eyebrow">PADVIEW / VIEWER</p><h1>透明盘面</h1><p>播放同一段谱面，切换棋盘、深色和浅色，观察击打特效。</p>
<label class="aspect-control">画布比例 <select id="aspect"><option>1:1</option><option selected>4:3</option><option>16:9</option></select></label>
<audio id="music" preload="metadata"></audio><div class="workbench demo-single"><section aria-label="盘面与播放控制"><div id="stage" class="padview-surface" data-backing="checker" aria-label="谱面预览"></div>
